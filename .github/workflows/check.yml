name: Check

# The one automatic entry for this repository. `build.yml`, `test.yml`,
# `browser.yml` and `tauri-smoke.yml` are called workflows: they are
# implementation of this entry, not dispatch surfaces of their own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    # Exactly the one secret the called workflow declares, and nothing else. On an
    # event without repository secrets - a fork pull request, or Dependabot - the
    # value is empty, the token step fails, and no broader credential is handed to
    # untrusted source to make CI pass.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  test:
    name: Unit Tests
    needs: [build]
    uses: ./.github/workflows/test.yml

  # The packaged Windows smoke runs after the unit tests, so a configuration
  # regression fails the fast job before a Windows runner builds and launches the
  # app. The desktop build itself runs inside `build.yml` on both platforms.
  tauri-smoke:
    name: Packaged Desktop Smoke
    needs: [test]
    uses: ./.github/workflows/tauri-smoke.yml

  browser:
    name: Browser Integration Tests
    needs: [test]
    uses: ./.github/workflows/browser.yml
