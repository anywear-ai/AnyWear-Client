[package]
name = "anywear"
version = "0.1.0"
description = "AnyWear desktop and mobile client"
authors = ["AnyWear"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anywear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Tauri CLI refuses a desktop or Android build when a Rust crate and its npm
# package disagree on major.minor. These stay on the dependency graph `Cargo.lock`
# carries, and the npm packages are aligned to the same minors: `@tauri-apps/api`
# 2.12, `@tauri-apps/plugin-log` 2.8 and `@tauri-apps/plugin-fs` 2.5. The tilde
# keeps patch updates inside the matching minor.
tauri = { version = "~2.12.4", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "~2.8.0"
tauri-plugin-fs = "~2.5.0"
log = "0.4.29"
