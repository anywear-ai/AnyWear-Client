name: Deploy Beta Web Client

# The one publication entry for this repository, on two events: a merge to `main`
# publishes the reviewed revision with no typed values, and a manual
# `operation: deploy` dispatch keeps the three interface overrides. Either event
# builds the revision and verifies it without credentials; `handoff` then hands the
# built bundle to `AnyWear-Infra`, which performs the publication. This repository
# holds no AWS credential at all: under the single-writer model (ADR 0033 §9)
# `AnyWear-Infra` is the only writer of Beta's served tuple.
on:
  # A merge whose changed files are all documentation starts nothing: every changed
  # path matches `paths-ignore`, so the run is skipped before any job — no artifact
  # is published, no deployment is handed off and no bundle is synced.
  # A file outside the list still starts the chain, because `paths-ignore` skips only
  # when every changed path matches: one source file beside one document deploys.
  # The twin declaration is the `push` trigger in the other repository: this list is
  # carried verbatim by AnyWear-Service/.github/workflows/service-beta.yml and
  # AnyWear-Client/.github/workflows/release.yml.
  # Landing this filter is itself a non-documentation merge: it starts one run in each
  # repository. It is the last merge of this documentation delivery that deploys.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy operation
        type: choice
        required: true
        options: [deploy]

      # Manual-only overrides for the three reviewed constants below. A push has no
      # inputs and compiles the constants; a dispatch may replace any of them.
      # build-metadata.json records exactly the values Vite compiled, and `verify`
      # refuses when the declared interface differs from them.
      api_base_url:
        description: Declared API base URL compiled into the bundle
        type: string
        required: true
      cognito_user_pool_id:
        description: Declared Cognito user pool id compiled into the bundle
        type: string
        required: true
      cognito_client_id:
        description: Declared Cognito client id compiled into the bundle
        type: string
        required: true

# The reviewed Beta interface, as last published: the API distribution's domain and
# the two Cognito values the Beta environment serves. The credential-free build
# cannot resolve them, so they are reviewed constants here and every job reads them
# through `inputs.<name> || env.BETA_<NAME>`: a push needs no input, and a manual
# dispatch can still override any of the three.
#
# `AnyWear-Infra`'s `publish-client` re-resolves the live interface and refuses a
# mismatch before the first S3 write. A recreated stack therefore fails closed
# instead of publishing an interface no review saw, and needs exactly one reviewed
# change here.
env:
  BETA_API_BASE_URL: 'https://d1pfqujqt29n11.cloudfront.net'
  BETA_COGNITO_USER_POOL_ID: 'ap-east-1_XqXt4Kw1L'
  BETA_COGNITO_CLIENT_ID: '4jp37atfitq59hmjo404342int'

# This queue serializes Client build-and-handoff runs, independently of Infra's
# queue.
concurrency:
  group: beta-client-publish
  cancel-in-progress: false
  # Up to 100 pending runs, processed in wait order; an in-flight handoff is never
  # cancelled by a newer merge.
  queue: max

permissions:
  contents: read

jobs:
  build:
    name: Build the reviewed Beta web client
    # The stage switch and the main ref gate the chain, and the event decides which
    # entry this is: a push is the publication request, and a dispatch needs
    # `deploy`. `build` and `verify` hold no credential; `handoff` waits for both.
    if: vars.ENABLE_BETA_MUTATION == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The digest `handoff` sends to Infra: the SHA-256 of the bundle manifest this
    # job wrote beside the assets. `verify` recomputes it before anything leaves the
    # repository.
    outputs:
      client_bundle_digest: ${{ steps.manifest.outputs.digest }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOURCE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Builds the assets and, in the same step, dist/build-metadata.json from
      # the same environment. Vite compiles these three variables into the bundle,
      # and write-build-metadata.mjs records the same variables. The step-level
      # `env:` is what lets the expression read the workflow-level constants: the
      # `env` context is not available in a job's `env:` block.
      - name: Build Beta web client
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || env.BETA_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ inputs.cognito_user_pool_id || env.BETA_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ inputs.cognito_client_id || env.BETA_COGNITO_CLIENT_ID }}
        run: pnpm build

      # The manifest names every built asset by path, SHA-256 and size, repeats the
      # identity and interface `build-metadata.json` records, and excludes itself.
      # It is written before the upload so the digest names bytes the uploaded
      # `client-dist` artifact carries.
      - name: Write the bundle manifest
        id: manifest
        run: node scripts/write-bundle-manifest.mjs

      - name: Upload built client
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify the built Beta web client
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BETA_MUTATION_ENABLED: ${{ vars.ENABLE_BETA_MUTATION }}

    steps:
      # `pnpm run test:run` below includes the ambient case in
      # `assert-client-version-bump.node-test.mjs`, which calls the real checker with
      # the CI environment. Under this workflow's `push` trigger the checker resolves
      # `github.event.before` from the event payload and reads that commit, so this
      # checkout must contain the history behind `github.sha`: a depth-1 checkout has
      # no such revision and the check fails on every merge. Fetch the whole history
      # (`0`), because `2` would cover only a single-commit push and fail for a
      # multi-commit push or a merge commit. `test.yml` fetches the same way for the
      # same reason.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built client
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      # Publication identity, the exact workflow/source sha, the interface values
      # recorded in build-metadata.json against the declared interface (the dispatch
      # overrides or, on a push, the reviewed constants), and the compiled assets
      # that must contain those values. It also proves the digest `handoff` sends:
      # the bundle manifest matches build-metadata.json and the asset inventory it
      # names, and its SHA-256 is the one `build` published.
      - name: Validate the publication identity, declared interface and bundle manifest
        env:
          CLIENT_BUNDLE_DIGEST: ${{ needs.build.outputs.client_bundle_digest }}
          DECLARED_API_BASE_URL: ${{ inputs.api_base_url || env.BETA_API_BASE_URL }}
          DECLARED_COGNITO_USER_POOL_ID: ${{ inputs.cognito_user_pool_id || env.BETA_COGNITO_USER_POOL_ID }}
          DECLARED_COGNITO_CLIENT_ID: ${{ inputs.cognito_client_id || env.BETA_COGNITO_CLIENT_ID }}
        run: node .github/scripts/assert-client-publication.mjs verify

      - name: Run unit tests
        run: pnpm run test:run

      # The browser suite also runs in check.yml on every push to main. It is
      # repeated here so the chain verifies the exact revision it is about to hand
      # over instead of relying on an earlier run.
      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run browser integration tests
        run: pnpm run test:browser

  handoff:
    name: Hand the built Beta web client to AnyWear-Infra
    needs: [build, verify]
    runs-on: ubuntu-latest
    # The observation of the created Infra run is bounded at 150 minutes, so the
    # deadline fires before this timeout and the step still reports what it saw.
    timeout-minutes: 160
    # No environment, no OIDC token and no AWS permission: this job holds one App
    # token, narrowed to AnyWear-Infra with `actions: write`, and nothing else. The
    # publication, the live-interface refusal and the post-publication smoke belong
    # to the Infra run.
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The dispatch target, owner-qualified: the token input below takes the bare
      # repository name, but every REST path here needs `owner/repo`.
      INFRA_OWNER: ${{ github.repository_owner }}
      INFRA_REPOSITORY: AnyWear-Infra
      INFRA_WORKFLOW: mutate.yml
      # The `publish-client` payload: this run's identity, the digest of the bundle
      # `verify` just proved, and this run's URL as both the run-name trailer the
      # dedupe matches and the `dispatched_by` the receiver records.
      CLIENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLIENT_RUN_ID: ${{ github.run_id }}
      CLIENT_RUN_ATTEMPT: ${{ github.run_attempt }}
      CLIENT_BUNDLE_DIGEST: ${{ needs.build.outputs.client_bundle_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The handoff program imports node builtins only, so this job installs nothing.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Mint the AnyWear-Infra dispatch token
        id: infra-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # One repository, named explicitly: without `repositories` the token
          # reaches every repository the App installation grants.
          repositories: AnyWear-Infra
          permission-actions: write

      # Dedupe, dispatch and read-back are one step: it skips the dispatch when an
      # Infra run of `mutate.yml` already names this Client run in its display title,
      # dispatches with `return_run_details: true`, reads the created run back by
      # id, and polls its job list until the Infra `deploy` job concludes. The job
      # fails when that job was skipped or did not succeed, naming the Infra run.
      - name: Dispatch the Infra publish-client run and read it back
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: node scripts/client-handoff.mjs
